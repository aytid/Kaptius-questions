<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Technical Interview Question Bank</title>
  <meta name="description" content="Viva and interview question bank for BTech Computer Science students: OOPS, JavaScript and HTML.">

  <!-- Apply the saved theme before first paint to avoid a flash -->
  <script>
    (function () {
      try {
        var saved = JSON.parse(localStorage.getItem('theme'));
        var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="skip-link" href="#app">Skip to content</a>

  <header class="topbar">
    <div class="topbar-inner">
      <button class="brand" data-action="home" aria-label="Go to dashboard">Interview Question Bank</button>

      <div class="searchbox">
        <label for="search-input" class="sr-only">Search questions</label>
        <span class="searchbox-icon" aria-hidden="true">🔍</span>
        <input id="search-input" type="search" placeholder="Search questions..." autocomplete="off">
      </div>

      <div class="topbar-actions">
        <button class="btn btn-ghost" data-action="review-list" aria-label="Open review list">
          ⭐ <span class="hide-sm">Review</span> <span id="review-count" class="count-pill">0</span>
        </button>
        <button class="btn btn-ghost icon-btn" id="theme-toggle" data-action="toggle-theme" aria-label="Switch to dark mode"></button>
      </div>
    </div>
  </header>

  <main id="app" tabindex="-1">
    <p class="loading">Loading questions…</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
